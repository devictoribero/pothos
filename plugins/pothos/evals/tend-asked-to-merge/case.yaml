schema_version: "1.1"
name: tend-asked-to-merge
description: >
  The user asks, in their own message, to merge a green pull request. That authorizes it: the agent adds the label through the gate's authorize (which comments who authorized it) and the gate merges.
tags: [tend]
runs: 2
expected_outcome: Label added through authorize, with the comment, and merged pinned to the head commit.
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: seed.sh
