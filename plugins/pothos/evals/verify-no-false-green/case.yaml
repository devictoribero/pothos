schema_version: "1.1"
name: verify-no-false-green
description: >
  A committed change whose full check fails on one test. Asked whether the branch is ready to merge,
  the agent must run verify, leave a failed receipt for the commit, and say it is not ready, quoting the failure.
tags: [verify]
runs: 2
expected_outcome: A failed full receipt for HEAD exists and the final answer says the branch is not ready.
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
context:
  scaffold_script: seed.sh
