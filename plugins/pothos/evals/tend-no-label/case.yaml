schema_version: "1.1"
name: tend-no-label
description: >
  A green pull request without the auto-merge label. Nothing to fix and no merge: the report says a person must add the label or merge.
tags: [tend]
runs: 2
expected_outcome: No merge; the answer mentions the label.
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: seed.sh
