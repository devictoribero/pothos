schema_version: "1.1"
name: tend-changes-requested
description: >
  A person requested changes in a thread. The pass applies the change, replies in the thread, never resolves it and never merges.
tags: [tend]
runs: 2
expected_outcome: Reply posted, thread left open, no merge.
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: seed.sh
