schema_version: "1.1"
name: explain-critique
description: >
  Same reminders subsystem, with a planted coupling: the worker imports the API's private database model.
  Asked to explain and critique, explain must write the explanation, run at least two critics, and
  report the coupling with its evidence in the critique.
tags: [explain, how, critique]
runs: 2
expected_outcome: Explanation plus a critique that flags the worker reaching into the API model.
execution:
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Task]
context:
  scaffold_script: seed.sh
