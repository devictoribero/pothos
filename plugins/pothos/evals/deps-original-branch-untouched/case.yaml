schema_version: "1.1"
name: deps-original-branch-untouched
description: >
  A full run whose only hygiene candidate goes red after the bump. The attempt stays in a worktree, the person's
  branch gets no commit and keeps its package.json, and the red drift-safe entry becomes an assessment, not a
  pull request.
tags: [update-dependencies]
runs: 2
expected_outcome: No commit on main, package.json unchanged, no pull request for swiper, the record says reported or failed for it.
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: seed.sh
