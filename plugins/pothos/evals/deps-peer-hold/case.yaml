schema_version: "1.1"
name: deps-peer-hold
description: >
  A hold on React 18. The coupled package whose peer range demands 19 is held; the one whose peer range keeps 18
  is not. The hold is reported once, not once per frozen package, and nothing is published in audit mode.
tags: [update-dependencies]
runs: 2
expected_outcome: react and react-konva are held, react-select stays a candidate, the hold is reported once.
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: seed.sh
