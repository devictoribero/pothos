schema_version: "1.1"
name: tend-bot-comment
description: >
  A review bot points at a real bug. The pass fixes it, verifies, pushes, replies and resolves the bot's thread, and does not merge while checks rerun.
tags: [tend]
runs: 2
expected_outcome: Fix pushed, reply posted, bot thread resolved, no merge.
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: seed.sh
