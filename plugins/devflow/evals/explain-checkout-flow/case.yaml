schema_version: "1.1"
name: explain-checkout-flow
description: >
  A small repo with a checkout flow split across three modules. explain must write a private HTML page
  (the template's light theme and dark toggle are covered by unit tests), a summary.md and an INDEX.md line, name the real functions
  in order, and leave the repository untouched.
tags: [explain]
runs: 3
expected_outcome: Page, summary and index line in the private folder; the explanation follows the real code.
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Task]
context:
  scaffold_script: seed.sh
