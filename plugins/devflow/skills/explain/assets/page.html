<!doctype html>
<html lang="{{LANG}}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script>
  // Light by default; the reader's last choice wins. Runs before paint to avoid a flash.
  try { var saved = localStorage.getItem('devflow-theme'); if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved); } catch (_) {}
</script>
<style>
  :root, [data-theme="light"] {
    color-scheme: light;
    --bg: #f7f9fa; --surface: #ffffff; --soft: #edf2f4; --fg: #15222a; --muted: #57666f; --line: #d3dce1;
    --accent: #0b6a80; --accent-soft: #dcedf1; --warn: #94560f; --warn-soft: #f6ead9; --bad: #a3312a; --good: #2c6e3f;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f161b; --surface: #16212a; --soft: #1b2831; --fg: #e4ecf0; --muted: #94a6b2; --line: #2e3e49;
    --accent: #5cc3dc; --accent-soft: #163842; --warn: #e89a62; --warn-soft: #3a2a1a; --bad: #f08a80; --good: #7fcf95;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 var(--sans); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; display: flex; flex-direction: column; gap: 44px; }
  .read { max-width: 760px; }
  header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1, h2, h3 { line-height: 1.2; margin: 0; text-wrap: balance; }
  h1 { font-size: 2.1rem; }
  h2 { font-size: 1.45rem; margin-bottom: 12px; }
  h3 { font-size: 1.05rem; margin-bottom: 6px; }
  p { margin: 0 0 12px; }
  .lede { font-size: 1.12rem; margin-top: 12px; }
  .meta { font: 600 .75rem/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  code { font-family: var(--mono); font-size: .86em; background: var(--soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .wrap > * { min-width: 0; max-width: 100%; }
  pre { font: 13px/1.6 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0; }
  ul, ol { margin: 0 0 12px; padding-left: 22px; } li { margin-bottom: 6px; }
  .theme-toggle { font: 600 .8rem var(--sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  figure { margin: 0; }
  .diagram { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .diagram iframe { display: block; width: 100%; height: min(80vh, 760px); border: 0; }
  figcaption { font-size: .93rem; color: var(--muted); margin-top: 10px; max-width: 780px; }
  figcaption a, a { color: var(--accent); }
  .table { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: .94rem; }
  th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  th { font: 600 .72rem/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--soft); }
  tr:last-child td { border-bottom: 0; }
  .callout { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 8px; padding: 14px 16px; }
  .callout.warn { background: var(--warn-soft); border-left-color: var(--warn); }
  .sources { font-size: .9rem; color: var(--muted); }
  @media (max-width: 560px) { h1 { font-size: 1.7rem; } header.top { flex-direction: column; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="read">
      <div class="meta"><!-- repo · date · commit --></div>
      <h1>{{TITLE}}</h1>
      <p class="lede"><!-- The answer in two or three sentences. --></p>
      <p class="callout" data-devflow-placeholder>This page is still being written. Reload it in a few minutes. / Esta página todavía se está escribiendo. Vuelve a cargarla en unos minutos.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema">Tema oscuro</button>
  </header>

  <!-- Sections go here. A diagram is a figure with an iframe pointing at diagrams/<name>.html:

  <section>
    <div class="read"><h2>…</h2><p>…</p></div>
    <figure>
      <div class="diagram"><iframe data-archify src="diagrams/NAME.html?theme=light" title="…" loading="lazy"></iframe></div>
      <figcaption>What the picture shows. <a href="diagrams/NAME.html" target="_blank">Abrir a pantalla completa</a>.</figcaption>
    </figure>
  </section>
  -->

  <footer class="sources read"><!-- Sources: files and commit the explanation is based on. --></footer>
</div>
<script>
  (function () {
    var root = document.documentElement, button = document.getElementById('theme-toggle');
    function frames() { return document.querySelectorAll('iframe[data-archify]'); }
    function apply(theme) {
      root.setAttribute('data-theme', theme);
      button.textContent = theme === 'dark' ? 'Tema claro' : 'Tema oscuro';
      frames().forEach(function (frame) {
        var src = frame.getAttribute('src').replace(/([?&])theme=(light|dark)/, '$1theme=' + theme);
        if (src.indexOf('theme=') === -1) src += (src.indexOf('?') === -1 ? '?' : '&') + 'theme=' + theme;
        if (src !== frame.getAttribute('src')) frame.setAttribute('src', src);
      });
    }
    apply(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
    button.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('devflow-theme', next); } catch (_) {}
      apply(next);
    });
  })();
</script>
<script src="../nav.js"></script>
</body>
</html>
