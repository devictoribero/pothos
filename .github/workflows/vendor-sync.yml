name: vendor-sync

# Weekly: if a pinned third-party skill has a newer upstream commit, copy it in and open a pull request.
# A person reviews the diff and runs the evals locally before merging; nothing updates on its own.
# Needs the repository setting "Allow GitHub Actions to create and approve pull requests". With the
# default token, the opened pull request does not trigger check.yml; add a VENDOR_SYNC_TOKEN secret
# (a fine-grained token with contents and pull-requests write) so CI runs on it.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream
        id: check
        shell: bash
        run: |
          set +e
          python3 scripts/vendor_sync.py check | tee check.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != 0 ] && [ "$status" != 10 ]; then exit "$status"; fi
      - name: Update pinned skills
        if: steps.check.outputs.status == '10'
        run: python3 scripts/vendor_sync.py update
      - name: Script tests and skill lint
        if: steps.check.outputs.status == '10'
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/lint_skills.py
      - name: Open pull request
        if: steps.check.outputs.status == '10'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.VENDOR_SYNC_TOKEN || github.token }}
          branch: vendor-sync
          title: "chore(vendor): update pinned third-party skills"
          commit-message: "chore(vendor): update pinned third-party skills"
          body-path: check.txt
          add-paths: plugins/pothos
